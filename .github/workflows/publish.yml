name: Publish django-formset

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: "Publish release"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["22.x"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get install -y gettext
        npm install --include=dev
        python -m pip install --upgrade pip
        python -m pip install build django --user
    - name: Build Parsers
      run: |
        npm run tag-attributes
        npm run no-comments
    - name: Build CSS files
      run: |
        npm run compilescss
        npm run tailwindcss
        npm run sprite-flags
    - name: Build Client
      run: |
        npm run esbuild.modular
        npm run esbuild.monolith
    - name: Translate *.po files
      run: cd formset && django-admin compilemessages
    - name: Build 🐍 Python 📦 Package
      run: python -m build --sdist --wheel --outdir dist/
    - name: Publish 🐍 Python 📦 Package to PyPI
      if: startsWith(github.ref, 'refs/tags') || startsWith(github.ref, 'refs/heads/releases')
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        password: ${{ secrets.PYPI_API_TOKEN_FORMSET }}
